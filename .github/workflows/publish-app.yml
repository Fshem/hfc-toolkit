name: Publish HFC Checker

# Builds the Shiny app in app/ with Shinylive so it runs in the browser (webR),
# and publishes it to GitHub Pages. Runs on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib
            any::haven
            any::readxl
            any::openxlsx

      - name: Assemble the app folder
        run: |
          mkdir -p build/app/hfc build/app/sample/data build/app/sample/excel/exercise build/app/sample/excel/templates
          cp app/*.R build/app/
          cp R/*.R build/app/hfc/
          cp inst/data/household_survey.dta build/app/sample/data/
          cp inst/excel/exercise/hfc_inputs_exercise.xlsm build/app/sample/excel/exercise/
          cp inst/excel/templates/hfc_inputs.xlsm build/app/sample/excel/templates/

      - name: Export with Shinylive
        run: Rscript -e 'shinylive::export("build/app", "site")'

      - name: Add a loading message
        run: |
          python3 - <<'PY'
          p = "site/index.html"; s = open(p, encoding="utf-8").read()
          note = """<div id="hfc-loading" style="position:fixed;left:50%;top:calc(50% + 70px);transform:translateX(-50%);max-width:92vw;text-align:center;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#3d4a44;z-index:9999">
          <strong>Starting HFC Checker</strong><br>R is loading in your browser. The first visit takes up to a minute; later visits are quicker.</div>
          <script>(function(){var n=document.getElementById('hfc-loading'),t0=Date.now();var iv=setInterval(function(){var f=document.querySelector('iframe');var ready=false;try{ready=!!(f&&f.contentDocument&&f.contentDocument.querySelector('.bslib-sidebar-layout,.sidebar'));}catch(e){}if(ready||Date.now()-t0>180000){n&&n.remove();clearInterval(iv);}},500);})();</script>"""
          s = s.replace("</body>", note + "\n</body>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
